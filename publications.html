---
layout: none
sitemap: false
---
{% comment %}
  /publications/ is a legacy URL -- the papers list now lives at /papers/.
  This page only redirects there so old links and bookmarks keep working.
{% endcomment %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Publications</title>
    <link rel="canonical" href="{{ '/papers/' | absolute_url }}" />
    <meta http-equiv="refresh" content="0; url={{ site.baseurl }}/papers/" />
    <meta name="robots" content="noindex" />
    <script>location.replace({{ site.baseurl | append: "/papers/" | jsonify }});</script>
  </head>
  <body>
    <p>This page has moved to <a href="{{ site.baseurl }}/papers/">Publications</a>.</p>
  </body>
</html>
